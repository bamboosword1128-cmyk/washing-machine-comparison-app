<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ノジマ店頭スタッフ向け、指定型番を含む2022〜2026年発売の洗濯機説明・比較ナビ" />
    <meta name="theme-color" content="#f7f4ef" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>洗濯機説明ナビ 2022–2026</title>
    <link rel="stylesheet" href="styles.css?v=feature-help-1" />
  </head>
  <body>
    <nav class="skip-links" aria-label="スキップリンク">
      <a href="#filters">絞り込み条件へ</a>
      <a href="#results">機種一覧へ</a>
      <a href="#compare">比較リストへ</a>
    </nav>

    <header class="topbar">
      <div class="brand-block">
        <p id="appKicker" class="eyebrow">ノジマ店頭スタッフ向け</p>
        <h1 id="appTitle">洗濯機説明ナビ 2022–2026</h1>
        <p class="update-line">データ基準日 <time id="updatedAt">2026-08-22</time></p>
      </div>
      <div class="summary" aria-label="掲載件数">
        <div><strong id="makerCount">5</strong><span>メーカー</span></div>
        <div><strong id="productCount">0</strong><span>機種</span></div>
        <div><strong id="visibleCount">0</strong><span>表示中</span></div>
      </div>
    </header>

    <main>
      <section class="workbench">
        <aside id="filters" class="filters skip-target" aria-label="機種の絞り込み" tabindex="-1">
          <label class="search-field">
            <span>キーワード</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="型番・メーカー・機能・用途で検索" />
          </label>

          <fieldset><legend>メーカー</legend><div id="makerFilters" class="chip-list"></div></fieldset>
          <fieldset><legend>発売年</legend><div id="yearFilters" class="chip-list"></div></fieldset>
          <fieldset><legend>タイプ</legend><div id="typeFilters" class="chip-list stack"></div></fieldset>
          <fieldset><legend>洗濯容量</legend><div id="capacityFilters" class="chip-list"></div></fieldset>
          <fieldset><legend>乾燥容量</legend><div id="dryCapacityFilters" class="chip-list"></div></fieldset>
          <fieldset><legend>乾燥方式</legend><div id="dryingMethodFilters" class="chip-list stack"></div></fieldset>
          <fieldset><legend>よく使う条件</legend><div id="quickFilters" class="chip-list stack"></div></fieldset>

          <div class="sales-note"><strong>成約前の確認</strong><p id="salesNote"></p></div>
        </aside>

        <section id="results" class="results skip-target" aria-labelledby="resultTitle" tabindex="-1">
          <div class="section-heading">
            <div><p class="eyebrow">機種一覧</p><h2 id="resultTitle">全機種</h2></div>
            <div class="result-actions">
              <span id="activeFilterSummary" class="filter-summary">条件なし</span>
              <button id="clearFilters" class="ghost-button" type="button">条件クリア</button>
            </div>
          </div>
          <p id="resultsStatus" class="sr-only" role="status" aria-live="polite"></p>
          <div id="productGrid" class="product-grid"></div>
        </section>
      </section>

      <section id="compare" class="compare-section skip-target" aria-labelledby="compareTitle" tabindex="-1">
        <div class="section-heading">
          <div><p class="eyebrow">接客比較</p><h2 id="compareTitle">比較リスト</h2></div>
          <button id="clearCompare" class="ghost-button" type="button">比較を空にする</button>
        </div>
        <div class="compare-presets" aria-label="代表機の一括比較">
          <span>一括置き換え</span>
          <div class="preset-box">
            <button type="button" data-preset="drum-representatives">ドラム代表 <small>4機種</small></button>
            <button type="button" data-preset="top-representatives">縦型代表 <small>4機種</small></button>
          </div>
        </div>
        <p id="compareStatus" class="compare-message" role="status" aria-live="polite"></p>
        <div id="compareEmpty" class="compare-empty">機種カードの「比較に追加」から、最大4機種を横並びにできます。</div>
        <div id="compareContent" hidden>
          <div class="compare-tools">
            <label class="difference-toggle" for="differenceOnly">
              <input id="differenceOnly" type="checkbox" />
              <span aria-hidden="true"></span>
              差分のみ表示
            </label>
            <small id="differenceModeHint">同じ値は薄く、異なる値は強調します。</small>
          </div>
          <section id="differenceSummary" class="difference-summary" aria-labelledby="differenceSummaryTitle"></section>
          <div id="compareWrap" class="compare-wrap" tabindex="0" aria-label="選択した洗濯機の比較表"></div>
        </div>
      </section>

      <section class="guide-section" aria-labelledby="guideTitle">
        <div class="section-heading"><div><p class="eyebrow">メーカー別</p><h2 id="guideTitle">売り分け早見</h2></div></div>
        <div id="makerGuide" class="maker-guide"></div>
      </section>
    </main>

    <button id="compareFab" class="compare-fab" type="button" aria-label="比較リストへ移動">比較 <strong data-compare-count>0</strong></button>

    <nav class="mobile-nav" aria-label="画面内移動">
      <a href="#filters">条件</a><a href="#results">一覧 <span id="mobileVisible">0</span></a><a href="#compare">比較 <span data-compare-count>0</span></a>
    </nav>

    <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle">
      <div class="dialog-shell">
        <button class="dialog-close" type="button" data-close-dialog aria-label="詳細を閉じる">×</button>
        <div id="detailContent"></div>
      </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js?v=feature-help-1"></script>
  </body>
</html>
